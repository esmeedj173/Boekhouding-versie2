:root{
  --ink:#371414; --ink-900:#200b0b; --surface:#452829; --blush:#C99F98; --blush-600:#b98d85; --cream:#E9E3DB;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--cream);font-family:Arial,Helvetica,sans-serif;padding-bottom:env(safe-area-inset-bottom);}
h1,h2,.brand{font-family:"Bedross",Georgia,serif;font-weight:normal;color:var(--blush);}
a{color:var(--blush);}
#app{display:flex;min-height:100vh;}
#sidebar{width:190px;flex-shrink:0;background:var(--ink-900);border-right:1px solid rgba(201,159,152,.12);padding:20px 14px;}
#sidebar .eyebrow{font-size:10px;letter-spacing:.2em;color:rgba(233,227,219,.5);text-transform:uppercase;margin-bottom:2px;}
#sidebar .brand{font-size:26px;margin-bottom:22px;}
#sidebar nav a{display:block;padding:9px 10px;border-radius:6px;color:rgba(233,227,219,.7);text-decoration:none;font-size:14px;margin-bottom:2px;}
#sidebar nav a.active{background:rgba(255,255,255,.13);color:#fff;}
#sidebar nav a:hover{background:rgba(255,255,255,.08);color:#fff;}
main{flex:1;padding:26px 30px 90px;max-width:900px;}
.card{background:var(--surface);border:1px solid rgba(201,159,152,.15);border-radius:12px;padding:20px;margin-bottom:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.stat .label{font-size:11px;color:rgba(233,227,219,.55);margin-bottom:4px;}
.stat .value{font-family:"Bedross",Georgia,serif;font-size:22px;color:var(--blush);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;text-transform:uppercase;letter-spacing:.03em;font-size:10px;color:rgba(233,227,219,.5);padding:8px 10px;border-bottom:1px solid rgba(201,159,152,.15);}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);}
tr:hover td{background:rgba(255,255,255,.04);}
.right{text-align:right;}
.btn{display:inline-block;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--blush);color:var(--ink);}
.btn-primary:hover{background:var(--blush-600);}
.btn-secondary{background:var(--surface);border:1px solid rgba(201,159,152,.3);color:var(--blush);}
.btn-danger{background:transparent;color:#f3a0a0;font-size:12px;border:none;cursor:pointer;}
label{display:block;font-size:11px;color:rgba(233,227,219,.5);margin-bottom:4px;margin-top:12px;}
input,select,textarea{width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(201,159,152,.25);border-radius:6px;padding:8px 10px;color:var(--cream);font-size:13px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blush);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-concept{background:rgba(255,255,255,.1);color:rgba(233,227,219,.6);}
.pill-verzonden{background:rgba(120,170,240,.15);color:#a8c8f5;}
.pill-betaald,.pill-geaccepteerd{background:rgba(180,220,150,.15);color:#c5e8a8;}
.pill-deels_betaald{background:rgba(240,190,110,.15);color:#f0c987;}
.pill-vervallen,.pill-afgewezen{background:rgba(240,120,120,.15);color:#f5a8a8;}
.pill-geannuleerd,.pill-verlopen{background:rgba(255,255,255,.08);color:rgba(233,227,219,.35);}
.row-flex{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.muted{color:rgba(233,227,219,.5);font-size:12px;}
.regelrow{display:grid;grid-template-columns:1.5fr 70px 90px 100px 24px;gap:8px;align-items:center;margin-bottom:8px;}
.totals{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;margin-top:12px;border-top:1px solid rgba(201,159,152,.15);padding-top:12px;}
.totals .final{font-family:"Bedross",Georgia,serif;font-size:17px;color:var(--blush);}
.totals span.w{display:inline-block;width:180px;display:flex;justify-content:space-between;}
#bottomnav{display:none;}
#mobiletopbar{display:none;}
.empty{text-align:center;color:rgba(233,227,219,.4);padding:30px 0;font-size:13px;}
.backlink{font-size:12px;color:rgba(233,227,219,.5);text-decoration:none;display:inline-block;margin-bottom:14px;}
@media (max-width:820px){
  #sidebar{display:none;}
  #bottomnav{display:none !important;}
  main{padding:16px 16px 40px;max-width:100%;}
  #mobiletopbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--ink-900);border-bottom:1px solid rgba(201,159,152,.15);
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    position:sticky;top:0;z-index:60;
  }
  #mobiletopbar .brandwrap{display:flex;align-items:baseline;gap:8px;}
  #mobiletopbar .eyebrow{font-size:9px;letter-spacing:.15em;color:rgba(233,227,219,.5);text-transform:uppercase;}
  #mobiletopbar .brand{font-size:22px;margin:0;}
  #menu-toggle{background:rgba(255,255,255,.08);border:1px solid rgba(201,159,152,.25);color:var(--cream);
    border-radius:8px;width:42px;height:42px;font-size:20px;line-height:1;cursor:pointer;}
  #mobilemenu{display:none;flex-direction:column;background:var(--ink-900);border-bottom:1px solid rgba(201,159,152,.15);
    position:sticky;top:0;z-index:59;padding:8px 10px 14px;}
  #mobilemenu.open{display:flex;}
  #mobilemenu a{display:block;padding:14px 12px;border-radius:8px;color:rgba(233,227,219,.8);text-decoration:none;font-size:16px;margin-bottom:3px;}
  #mobilemenu a.active{background:rgba(255,255,255,.13);color:#fff;}
  .regelrow{grid-template-columns:1fr;gap:4px;background:rgba(0,0,0,.15);padding:8px;border-radius:8px;margin-bottom:8px;}
}
#print-invoice{display:none;}
@media print {
  body * { visibility: hidden; }
  #print-invoice, #print-invoice * { visibility: visible; }
  #print-invoice {
    display:block !important;
    position:absolute; top:0; left:0; width:100%;
    background:#fff; color:#1a1a1a; font-family: Arial, Helvetica, sans-serif;
    padding:36px; font-size:13px;
  }
  .pi-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px;}
  .pi-brand{font-family:Georgia,serif;font-size:26px;color:#452829;}
  .pi-title{font-size:20px;letter-spacing:.1em;color:#8a8a8a;text-align:right;}
  .pi-parties{display:flex;justify-content:space-between;margin-bottom:28px;gap:24px;}
  .pi-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:4px;}
  .pi-meta{margin-bottom:26px;font-size:13px;line-height:1.7;}
  .pi-meta b{display:inline-block;width:120px;color:#666;font-weight:normal;}
  table.pi-table{width:100%;border-collapse:collapse;margin-bottom:22px;}
  table.pi-table th{text-align:left;font-size:10px;text-transform:uppercase;color:#999;border-bottom:2px solid #452829;padding:6px 8px;}
  table.pi-table td{padding:8px;border-bottom:1px solid #eee;}
  .pi-right{text-align:right;}
  .pi-totals{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-bottom:34px;}
  .pi-totals .w{display:flex;justify-content:space-between;width:220px;}
  .pi-totals .final{font-weight:bold;font-size:15px;border-top:1px solid #452829;padding-top:6px;margin-top:2px;}
  .pi-footer{border-top:1px solid #ddd;padding-top:14px;font-size:11px;color:#777;line-height:1.7;}
}
</style>
</head>
<body>
<div id="mobiletopbar">
  <div class="brandwrap">
    <div>
      <div class="eyebrow">Boekhouding</div>
      <div class="brand">Lumié</div>
    </div>
  </div>
  <button id="menu-toggle" onclick="toggleMobileMenu()">☰</button>
</div>
<nav id="mobilemenu"></nav>
<div id="app">
  <aside id="sidebar">
    <div class="eyebrow">Boekhouding</div>
    <div class="brand">Lumié</div>
    <nav id="navlinks"></nav>
  </aside>
  <main id="main"></main>
</div>
<div id="print-invoice"></div>

<script>
// ---------- IndexedDB helper ----------
const DB_NAME = "lumie_boekhouding";
const DB_VERSION = 1;
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains("klanten")) db.createObjectStore("klanten", { keyPath: "id" });
    if (!db.objectStoreNames.contains("facturen")) db.createObjectStore("facturen", { keyPath: "id" });
    if (!db.objectStoreNames.contains("factuurregels")) {
      const s = db.createObjectStore("factuurregels", { keyPath: "id" });
      s.createIndex("factuur_id", "factuur_id");
    }
    if (!db.objectStoreNames.contains("offertes")) db.createObjectStore("offertes", { keyPath: "id" });
    if (!db.objectStoreNames.contains("offerteregels")) {
      const s = db.createObjectStore("offerteregels", { keyPath: "id" });
      s.createIndex("offerte_id", "offerte_id");
    }
    if (!db.objectStoreNames.contains("betalingen")) {
      const s = db.createObjectStore("betalingen", { keyPath: "id" });
      s.createIndex("factuur_id", "factuur_id");
    }
    if (!db.objectStoreNames.contains("instellingen")) db.createObjectStore("instellingen", { keyPath: "key" });
  };
  req.onsuccess = (e) => resolve(e.target.result);
  req.onerror = (e) => reject(e);
});

async function tx(storeName, mode, fn) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const t = db.transaction(storeName, mode);
    const store = t.objectStore(storeName);
    const result = fn(store);
    t.oncomplete = () => resolve(result);
    t.onerror = (e) => reject(e);
  });
}
function reqToPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getAll(storeName) {
  const db = await dbPromise;
  return reqToPromise(db.transaction(storeName, "readonly").objectStore(storeName).getAll());
}
async function getByIndex(storeName, indexName, value) {
  const db = await dbPromise;
  return reqToPromise(db.transaction(storeName, "readonly").objectStore(storeName).index(indexName).getAll(value));
}
async function getOne(storeName, key) {
  const db = await dbPromise;
  return reqToPromise(db.transaction(storeName, "readonly").objectStore(storeName).get(key));
}
async function put(storeName, obj) {
  const db = await dbPromise;
  return reqToPromise(db.transaction(storeName, "readwrite").objectStore(storeName).put(obj));
}
async function del(storeName, key) {
  const db = await dbPromise;
  return reqToPromise(db.transaction(storeName, "readwrite").objectStore(storeName).delete(key));
}
async function getSetting(key, fallback) {
  const s = await getOne("instellingen", key);
  return s ? s.value : fallback;
}
async function setSetting(key, value) {
  return put("instellingen", { key, value });
}
async function ensureDefaults() {
  const defaults = { factuur_prefix: "LUM", factuur_volgnummer: 0, offerte_prefix: "OFF", offerte_volgnummer: 0 };
  for (const k in defaults) {
    const existing = await getOne("instellingen", k);
    if (!existing) await setSetting(k, defaults[k]);
  }
}
async function volgendNummer(prefixKey, volgnummerKey) {
  const prefix = await getSetting(prefixKey, "NR");
  let n = await getSetting(volgnummerKey, 0);
  n = n + 1;
  await setSetting(volgnummerKey, n);
  const jaar = new Date().getFullYear();
  return `${prefix}-${jaar}-${String(n).padStart(4, "0")}`;
}
function uid() { return crypto.randomUUID(); }
function euro(n) { return new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" }).format(n || 0); }
function fmtDate(d) { return new Date(d).toLocaleDateString("nl-NL"); }
function today() { return new Date().toISOString().slice(0, 10); }
function plusDays(n) { return new Date(Date.now() + n * 86400000).toISOString().slice(0, 10); }

async function viewBtw() {
  const facturen = (await getAll("facturen")).filter(f => f.status !== "concept" && f.status !== "geannuleerd");
  const perKwartaal = {};
  facturen.forEach(f => {
    const d = new Date(f.factuurdatum);
    const q = Math.floor(d.getMonth() / 3) + 1;
    const key = `${d.getFullYear()} - Q${q}`;
    if (!perKwartaal[key]) perKwartaal[key] = { subtotaal: 0, btw: 0, totaal: 0, aantal: 0 };
    perKwartaal[key].subtotaal += f.subtotaal; perKwartaal[key].btw += f.btw_bedrag; perKwartaal[key].totaal += f.totaal; perKwartaal[key].aantal += 1;
  });
  const kwartalen = Object.keys(perKwartaal).sort().reverse();
  return `
    <h1>BTW-overzicht</h1>
    <p class="muted" style="margin-bottom:18px;">Gebaseerd op factuurdatum van verzonden/betaalde facturen. Controleer altijd zelf de definitieve cijfers voor je aangifte.</p>
    <div class="card" style="padding:0;overflow:hidden;">
      <table><thead><tr><th>Kwartaal</th><th class="right">Aantal</th><th class="right">Omzet excl. BTW</th><th class="right">BTW</th><th class="right">Totaal</th></tr></thead><tbody>
      ${kwartalen.length === 0 ? `<tr><td colspan="5" class="empty">Nog geen gegevens</td></tr>` : kwartalen.map(k => `
        <tr><td>${k}</td><td class="right">${perKwartaal[k].aantal}</td><td class="right">${euro(perKwartaal[k].subtotaal)}</td><td class="right">${euro(perKwartaal[k].btw)}</td><td class="right">${euro(perKwartaal[k].totaal)}</td></tr>`).join("")}
      </tbody></table>
    </div>`;
}

  f.status = status;
  await put("facturen", f);
  render();
}
async function markeerBetaald(id) {
  const f = await getOne("facturen", id);
  f.status = "betaald";
  f.betaald_bedrag = f.totaal;
  await put("facturen", f);
  render();
}
async function markeerNietBetaald(id) {
  const f = await getOne("facturen", id);
  const betalingen = await getByIndex("betalingen", "factuur_id", id);
  const geregistreerd = betalingen.reduce((s, b) => s + b.bedrag, 0);
  f.betaald_bedrag = geregistreerd;
  f.status = geregistreerd > 0 ? "deels_betaald" : "verzonden";
  await put("facturen", f);
  render();
}
async function verwijderFactuur(id) {
  if (!confirm("Deze factuur en alle bijbehorende regels en betalingen verwijderen? Dit kan niet ongedaan gemaakt worden.")) return;

  navigate("facturen");
}

async function verwijderKlant(id) {
  if (!confirm("Deze klant verwijderen? Facturen/offertes die al bij deze klant horen blijven bestaan, maar tonen dan geen klantnaam meer.")) return;
  await del("klanten", id);
  navigate("klanten");
}
async function verwijderOfferte(id) {
  if (!confirm("Deze offerte en de bijbehorende regels verwijderen?")) return;
  const regels = await getByIndex("offerteregels", "offerte_id", id);
  for (const r of regels) await del("offerteregels", r.id);
  await del("offertes", id);
  render();
}
async function registreerBetaling(e, factuurId) {
  e.preventDefault();
  const bedrag = parseFloat(e.target.bedrag.value);
  if (!bedrag || bedrag <= 0) return false;
  await put("betalingen", { id: uid(), factuur_id: factuurId, bedrag, datum: today(), created_at: Date.now() });
  const f = await getOne("facturen", factuurId);
  const betalingen = await getByIndex("betalingen", "factuur_id", factuurId);
  const betaald = betalingen.reduce((s, b) => s + b.bedrag, 0);
  f.betaald_bedrag = betaald;
  if (betaald >= f.totaal && f.totaal > 0) f.status = "betaald";
  else if (betaald > 0) f.status = "deels_betaald";
  await put("facturen", f);
  render();
  return false;
}

async function exportBackup() {
  const stores = ["klanten", "facturen", "factuurregels", "offertes", "offerteregels", "betalingen", "instellingen"];
  const data = {};
  for (const s of stores) data[s] = await getAll(s);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `lumie-boekhouding-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
async function importBackup() {
  const input = document.getElementById("import-file");
  if (!input.files.length) { alert("Kies eerst een back-upbestand."); return; }
  const text = await input.files[0].text();
  let data;
  try { data = JSON.parse(text); } catch { alert("Ongeldig bestand."); return; }
  for (const store of Object.keys(data)) {
    for (const row of data[store]) {
      await put(store, row);
    }
  }
  alert("Back-up geïmporteerd.");
  render();
}

function attachHandlers() {
  const kf = document.getElementById("klant-form");
  if (kf) kf.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(kf);
    const klant = Object.fromEntries(fd.entries());
    const editId = kf.dataset.editId;
    if (editId) {
      const bestaand = await getOne("klanten", editId);
      klant.id = editId;
      klant.created_at = bestaand ? bestaand.created_at : Date.now();
      await put("klanten", klant);
      navigate("klanten", editId);
    } else {
      klant.id = uid();
      klant.created_at = Date.now();
      await put("klanten", klant);
      navigate("klanten");
    }
  });

  const ff = document.getElementById("factuur-form");
  if (ff) {
    renderRegels();
    ff.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(ff);
      const klantId = fd.get("klant_id");
      if (!klantId) { alert("Kies een klant"); return; }
      const regels = regelState.filter(r => r.omschrijving.trim() !== "");
      const subtotaal = regels.reduce((s, r) => s + r.aantal * r.prijs_per_stuk, 0);
      const btwBedrag = regels.reduce((s, r) => s + r.aantal * r.prijs_per_stuk * (r.btw_percentage / 100), 0);
      const editId = ff.dataset.editId;

      if (editId) {
        const bestaand = await getOne("facturen", editId);
        bestaand.klant_id = klantId;
        bestaand.factuurdatum = fd.get("factuurdatum");
        bestaand.vervaldatum = fd.get("vervaldatum");
        bestaand.omschrijving = fd.get("omschrijving");
        bestaand.subtotaal = subtotaal;
        bestaand.btw_bedrag = btwBedrag;
        bestaand.totaal = subtotaal + btwBedrag;
        await put("facturen", bestaand);
        const oudeRegels = await getByIndex("factuurregels", "factuur_id", editId);
        for (const r of oudeRegels) await del("factuurregels", r.id);
        for (let i = 0; i < regels.length; i++) {
          await put("factuurregels", { id: uid(), factuur_id: editId, volgorde: i, ...regels[i] });
        }
        navigate("facturen", editId);
      } else {
        const factuurId = uid();
        const factuurnummer = await volgendNummer("factuur_prefix", "factuur_volgnummer");
        await put("facturen", {
          id: factuurId, factuurnummer, klant_id: klantId,
          factuurdatum: fd.get("factuurdatum"), vervaldatum: fd.get("vervaldatum"),
          omschrijving: fd.get("omschrijving"), subtotaal, btw_bedrag: btwBedrag, totaal: subtotaal + btwBedrag,
          betaald_bedrag: 0, status: "concept", created_at: Date.now()
        });
        for (let i = 0; i < regels.length; i++) {
          await put("factuurregels", { id: uid(), factuur_id: factuurId, volgorde: i, ...regels[i] });
        }
        navigate("facturen", factuurId);
      }
    });
  }

  const of = document.getElementById("offerte-form");
  if (of) {
    renderRegels();
    of.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(of);
      const klantId = fd.get("klant_id");
      if (!klantId) { alert("Kies een klant"); return; }
      const regels = regelState.filter(r => r.omschrijving.trim() !== "");
      const subtotaal = regels.reduce((s, r) => s + r.aantal * r.prijs_per_stuk, 0);
      const btwBedrag = regels.reduce((s, r) => s + r.aantal * r.prijs_per_stuk * (r.btw_percentage / 100), 0);
      const editId = of.dataset.editId;

      if (editId) {
        const bestaand = await getOne("offertes", editId);
        bestaand.klant_id = klantId;
        bestaand.offertedatum = fd.get("offertedatum");
        bestaand.geldig_tot = fd.get("geldig_tot");
        bestaand.omschrijving = fd.get("omschrijving");
        bestaand.subtotaal = subtotaal;
        bestaand.btw_bedrag = btwBedrag;
        bestaand.totaal = subtotaal + btwBedrag;
        await put("offertes", bestaand);
        const oudeRegels = await getByIndex("offerteregels", "offerte_id", editId);
        for (const r of oudeRegels) await del("offerteregels", r.id);
        for (let i = 0; i < regels.length; i++) {
          await put("offerteregels", { id: uid(), offerte_id: editId, volgorde: i, ...regels[i] });
        }
        navigate("offertes");
      } else {
        const offerteId = uid();
        const offertenummer = await volgendNummer("offerte_prefix", "offerte_volgnummer");
        await put("offertes", {
          id: offerteId, offertenummer, klant_id: klantId,
          offertedatum: fd.get("offertedatum"), geldig_tot: fd.get("geldig_tot"),
          omschrijving: fd.get("omschrijving"), subtotaal, btw_bedrag: btwBedrag, totaal: subtotaal + btwBedrag,
          status: "concept", created_at: Date.now()
        });
        for (let i = 0; i < regels.length; i++) {
          await put("offerteregels", { id: uid(), offerte_id: offerteId, volgorde: i, ...regels[i] });
        }
        navigate("offertes");
      }
    });
  }
}

// ---------- Init ----------
(async function init() {
  await ensureDefaults();
  const parts = location.hash.replace("#", "").split("/");
  currentRoute = { view: parts[0] || "overzicht", param: parts[1] || null, action: parts[2] || null };
  render();
})();
</script>
